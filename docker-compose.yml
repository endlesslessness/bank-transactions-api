services:
    db:
        image: postgres:16-alpine
        restart: unless-stopped
        env_file:
            - ./backend/.env
        volumes:
            - pg_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10

    backend:
        build:
            context: ./backend
        restart: unless-stopped
        env_file:
            - ./backend/.env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - "8000:8000"
        healthcheck:
            test:
                - CMD
                - python
                - -c
                - |
                    import sys, urllib.request
                    sys.exit(0 if urllib.request.urlopen(
                        "http://localhost:8000/health", timeout=3).status == 200 else 1)
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./frontend:/usr/share/nginx/html:ro
        depends_on:
            backend:
                condition: service_healthy
        ports:
            - "80:80"
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    pg_data:
    redis_data:
